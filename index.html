
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>idk welk titel doe gwn</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 15px;
            background: #f4f4f4;
        }

        .instellingen {
            margin-bottom: 18px;
            padding: 15px;
            background: white;
            border: 1px solid #ccc;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .instellingen label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instelling-input {
            width: 80px;
            padding: 8px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #90c990;
            color: #172b17;
        }

        input {
            width: 90%;
            padding: 8px;
            box-sizing: border-box;
        }

        .vak-input {
            width: 100%;
        }

        @media (max-width: 650px) {
            body {
                padding: 0 5px;
            }

            th, td {
                padding: 7px;
                font-size: 13px;
            }

            input {
                width: 100%;
                min-width: 65px;
            }

            .instelling-input {
                width: 70px;
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <div class="instellingen">
        <label>
            Aantal procent nodig bij SEM:
            <input
                id="doelinput"
                class="instelling-input"
                type="number"
                min="0"
                max="100"
                step="any"
                value="50"
            > %
        </label>

        <label>
            DW:
            <input
                id="dwprocentinput"
                class="instelling-input"
                type="number"
                min="0"
                max="100"
                step="any"
                value="30"
            > %
        </label>
    </div>

    <table>
        <thead>
            <tr>
                <th id="vakheader">Vak (30% DW en 70% EX)</th>
                <th>Totaal DW</th>
                <th id="examenheader">
                    Aantal % nodig op examen om 50%+ te hebben op SEM
                </th>
            </tr>
        </thead>

        <tbody id="rijen"></tbody>
    </table>

    <script>
        const vakken = [
            "Geschiedenis",
            "Nederlands",
            "Biologie",
            "Fysica",
            "Frans",
            "Chemie",
            "Engels",
            "Wiskunde",
            "Godsdienst",
            "Aardrijkskunde",
            "",
            ""
        ];

        const rijen = document.getElementById("rijen");
        const doelinput = document.getElementById("doelinput");
        const dwprocentinput =
            document.getElementById("dwprocentinput");

        const vakheader = document.getElementById("vakheader");
        const examenheader = document.getElementById("examenheader");

        const vaknamen = [];

        vakken.forEach((vak, nummer) => {
            const rij = document.createElement("tr");

            const vakvak = document.createElement("td");
            const dwvak = document.createElement("td");
            const examenvak = document.createElement("td");

            let vakinput = null;

            if (vak) {
                vaknamen[nummer] = vak;
                vakvak.textContent = vak;
            } else {
                vakinput = document.createElement("input");
                vakinput.type = "text";
                vakinput.placeholder = "Typ een vak";
                vakinput.className = "vak-input";

                vaknamen[nummer] = "";

                vakinput.addEventListener("input", () => {
                    vaknamen[nummer] = vakinput.value.trim();
                });

                vakvak.appendChild(vakinput);
            }

            const dwinput = document.createElement("input");

            dwinput.type = "number";
            dwinput.min = "0";
            dwinput.max = "100";
            dwinput.step = "any";
            dwinput.placeholder = "DW %";

            const examenresultaat = document.createElement("span");
            examenresultaat.textContent = "—";

            function bereken() {
                if (dwinput.value.trim() === "") {
                    examenresultaat.textContent = "—";
                    return;
                }

                const dwpunt = Number(dwinput.value);
                const doel = Number(doelinput.value);
                const dwprocent = Number(dwprocentinput.value);

                if (
                    !Number.isFinite(dwpunt) ||
                    dwpunt < 0 ||
                    dwpunt > 100 ||
                    doelinput.value.trim() === "" ||
                    !Number.isFinite(doel) ||
                    doel < 0 ||
                    doel > 100 ||
                    dwprocentinput.value.trim() === "" ||
                    !Number.isFinite(dwprocent) ||
                    dwprocent < 0 ||
                    dwprocent > 100
                ) {
                    examenresultaat.textContent = "uhh";
                    return;
                }

                const dwdeel = dwprocent / 100;
                const examendeel = 1 - dwdeel;

                let nodig;

                if (examendeel === 0) {
                    nodig = doel - dwpunt;
                } else {
                    nodig = (doel - dwdeel * dwpunt) / examendeel;
                }

                if (nodig <= 0) {
                    examenresultaat.textContent = "0,0%";
                } else if (nodig > 100) {
                    examenresultaat.textContent = "Meer dan 100%";
                } else {
                    examenresultaat.textContent =
                        nodig.toFixed(1).replace(".", ",") + "%";
                }
            }

            dwinput.addEventListener("input", bereken);

            dwvak.appendChild(dwinput);
            examenvak.appendChild(examenresultaat);

            rij.appendChild(vakvak);
            rij.appendChild(dwvak);
            rij.appendChild(examenvak);

            rijen.appendChild(rij);
        });

        function updateinstellingen() {
            const doel = doelinput.value;
            const dwprocent = dwprocentinput.value;

            const doelgoed =
                doel.trim() !== "" &&
                Number.isFinite(Number(doel)) &&
                Number(doel) >= 0 &&
                Number(doel) <= 100;

            const dwgoed =
                dwprocent.trim() !== "" &&
                Number.isFinite(Number(dwprocent)) &&
                Number(dwprocent) >= 0 &&
                Number(dwprocent) <= 100;

            if (dwgoed) {
                const dw = Number(dwprocent);
                const examen = 100 - dw;

                vakheader.textContent =
                    `Vak (${dw}% DW en ${examen}% EX)`;
            } else {
                vakheader.textContent = "Vak (bro typ gwn in bij DW)";
            }

            if (doelgoed) {
                examenheader.textContent =
                    `Aantal % nodig op examen om ${doel}%+ te hebben op SEM`;
            } else {
                examenheader.textContent =
                    "Aantal % nodig op examen om ... te hebben op SEM";
            }

            document.querySelectorAll("#rijen tr").forEach((rij) => {
                const dwinput = rij.querySelector('input[type="number"]');

                if (dwinput) {
                    dwinput.dispatchEvent(new Event("input"));
                }
            });
        }

        doelinput.addEventListener("input", updateinstellingen);
        dwprocentinput.addEventListener("input", updateinstellingen);
    </script>

</body>
</html>
